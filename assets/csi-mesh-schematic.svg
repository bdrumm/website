<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="mesh-title mesh-desc">
<title id="mesh-title">Wi-Fi channel sensing schematic</title><desc id="mesh-desc">Three ESP32 radios exchange ESP-NOW packets across changing radio paths. Receivers capture channel I/Q values and report CSI to the host over UDP port 5568.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#83f2d2"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e4eef6;font-size:16px}.small{font-size:13px;fill:#aec4d6}.box{fill:#132b3c;stroke:#587287;stroke-width:1.2}.flow{fill:none;stroke:#83f2d2;stroke-width:1.8;marker-end:url(#arrow)}.line{fill:none;stroke:#83f2d2;stroke-width:1.5}.accent{fill:#83f2d2}</style>
<rect width="320" height="300" rx="6" fill="#091525"/>
<text x="160" y="25" text-anchor="middle" class="small">ESP-NOW / CHANGING RADIO PATHS</text>
<path d="M74 76H246M62 98L145 170M258 98L175 170" class="flow" marker-start="url(#arrow)"/>
<path d="M76 88Q160 137 244 88" class="line" stroke-dasharray="4 5" opacity=".6"/>
<circle cx="52" cy="76" r="23" class="box"/><circle cx="268" cy="76" r="23" class="box"/><circle cx="160" cy="186" r="23" class="box"/>
<g text-anchor="middle"><text x="52" y="81">A</text><text x="268" y="81">B</text><text x="160" y="191">C</text><text x="52" y="119" class="small">ESP32</text><text x="268" y="119" class="small">ESP32</text><text x="160" y="141" class="small">CSI at each receiver</text></g>
<path d="M160 210V232" class="flow"/>
<rect x="24" y="239" width="272" height="43" rx="4" class="box"/><text x="160" y="266" text-anchor="middle">I/Q records → UDP 5568 → host</text>
</svg>
