<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="camera-title camera-desc">
<title id="camera-title">Camera capture and host motion schematic</title><desc id="camera-desc">An OV2640 connects to ESP32-CAM through DVP. Alternatively, a MIPI sensor connects to the ESP32-P4 image pipeline. Both send JPEG frames over TCP port 5569 to host motion and bearing processing.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#92b9ff"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#e4eef6;font-size:16px}.small{font-size:13px;fill:#aec4d6}.box{fill:#132b3c;stroke:#587287;stroke-width:1.2}.flow{fill:none;stroke:#92b9ff;stroke-width:1.8;marker-end:url(#arrow)}.line{fill:none;stroke:#92b9ff;stroke-width:1.5}.accent{fill:#92b9ff}</style>
<rect width="320" height="300" rx="6" fill="#091525"/>
<text x="160" y="25" text-anchor="middle" class="small">TWO CAMERA CAPTURE PATHS</text>
<rect x="20" y="43" width="125" height="40" rx="4" class="box"/><rect x="175" y="43" width="125" height="40" rx="4" class="box"/><text x="82" y="69" text-anchor="middle">OV2640</text><text x="237" y="69" text-anchor="middle">MIPI sensor</text>
<path d="M82 84V115M237 84V115" class="flow"/><text x="95" y="104" class="small">DVP</text><text x="250" y="104" class="small">MIPI</text>
<rect x="20" y="122" width="125" height="54" rx="4" class="box"/><rect x="175" y="122" width="125" height="54" rx="4" class="box"/>
<text x="82" y="146" text-anchor="middle">ESP32-CAM</text><text x="82" y="166" text-anchor="middle" class="small">JPEG capture</text><text x="237" y="146" text-anchor="middle">ESP32-P4</text><text x="237" y="166" text-anchor="middle" class="small">ISP + JPEG</text>
<path d="M82 177V195H160M237 177V195H160V211" class="flow"/>
<rect x="20" y="218" width="280" height="40" rx="4" class="box"/><text x="160" y="244" text-anchor="middle">JPEG frames · TCP 5569</text>
<text x="160" y="286" text-anchor="middle" class="small">HOST → MOTION BLOBS + BEARINGS</text>
</svg>
